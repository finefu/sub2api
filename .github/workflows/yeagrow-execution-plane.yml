# YeaGrow execution-plane CI (fork-only; upstream workflows are unchanged).
# Runs for the yeagrow/execution-plane branch and PRs based on it:
#   - Go 1.27.4 build + `go test ./...` and `go test -tags=unit ./...`
#     (failing packages are rerun once, with warnings; see .github/yeagrow/go_test_rerun.py)
#   - Docker image build with digest output, NOT pushed
#   - GHCR publish job, disabled until the repository variable
#     YEAGROW_PUBLISH_GHCR is set to "true" (push events on yeagrow/execution-plane only)
name: YeaGrow execution plane

on:
  push:
    branches: [yeagrow/execution-plane]
  pull_request:
    branches: [yeagrow/execution-plane]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yeagrow-execution-plane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: go test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: default
            flags: ""
          - suite: unit
            flags: "-tags=unit"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: go version | grep -q 'go1.27.4'
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Test (one visible rerun of failing packages)
        working-directory: backend
        run: python3 ../.github/yeagrow/go_test_rerun.py ${{ matrix.suite }} ${{ matrix.flags }}
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-test-${{ matrix.suite }}
          path: backend/go-test-*.json
          retention-days: 14

  image:
    name: docker image (not pushed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: go-test
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build image to an OCI archive (no registry push)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg GOPROXY=https://proxy.golang.org,direct \
            --build-arg GOSUMDB=sum.golang.org \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg VERSION=yeagrow-${{ github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.licenses=LGPL-3.0 \
            --output type=oci,dest=/tmp/sub2api-image.oci.tar \
            --metadata-file /tmp/sub2api-image.metadata.json \
            .
      - name: Image digest
        run: |
          digest=$(jq -r '."containerimage.digest"' /tmp/sub2api-image.metadata.json)
          config=$(jq -r '."containerimage.config.digest"' /tmp/sub2api-image.metadata.json)
          test -n "$digest" && test "$digest" != null
          echo "::notice title=Image digest (not pushed)::$digest"
          {
            echo "### Docker image (built, not pushed)"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| manifest digest | \`$digest\` |"
            echo "| config digest | \`$config\` |"
            echo "| archive size | $(du -h /tmp/sub2api-image.oci.tar | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload image metadata
        uses: actions/upload-artifact@v7
        with:
          name: image-metadata
          path: /tmp/sub2api-image.metadata.json
          retention-days: 14

  publish-ghcr:
    name: publish to GHCR (disabled)
    # Off until decided: set repository variable YEAGROW_PUBLISH_GHCR=true.
    # Never runs for pull requests.
    if: ${{ vars.YEAGROW_PUBLISH_GHCR == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/yeagrow/execution-plane' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [go-test, image]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
            COMMIT=${{ github.sha }}
            VERSION=yeagrow-${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/sub2api:yeagrow-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=LGPL-3.0
      - name: Published digest
        run: |
          echo "::notice title=GHCR digest::${{ steps.push.outputs.digest }}"
          echo "ghcr.io/${{ github.repository_owner }}/sub2api@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
